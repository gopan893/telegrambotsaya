services:
  - type: web
    name: telegram-ai-bot
    env: node
    region: singapore
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
      - key: RENDER_EXTERNAL_HOSTNAME
        fromService:
          type: web
          name: telegram-ai-bot
          property: host
      - key: TELEGRAM_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: DASHBOARD_ADMIN_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: STORAGE_DRIVER
        value: auto
      - key: PGSSL
        value: "false"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DASHBOARD_ENABLED
        value: "true"
      - key: OWNER_CHAT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
