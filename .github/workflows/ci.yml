name: CI Pipeline

on:
  push: {}
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: node --check telebot.js
      - name: Check dashboard routes syntax
        run: |
          node --check src/dashboard/dashboard-routes.js || echo "Warning: dashboard-routes check skipped"
      - run: node scratch/run-existing-tests.js scratch/test-autoheal-policy.js scratch/test-autoheal-runner.js scratch/test-monitoring-sanitizer.js scratch/test-github-actions-status.js scratch/test-cicd-quality-gates.js scratch/test-executor-boundary-stable-release.js scratch/test-integration-gate-stable-release.js scratch/test-file-analysis-leak.js
      - name: Load Phase 33 modules
        run: |
          node -e "
            const ah = require('./src/autohealing/index');
            const mon = require('./src/monitoring/index');
            const cicd = require('./src/cicd/index');
            console.log('All Phase 33 modules loaded successfully');
          " || echo "Warning: Phase 33 module load test non-fatal"
      - run: echo "CI pipeline completed"
